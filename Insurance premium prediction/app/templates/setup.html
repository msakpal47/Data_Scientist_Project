<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Model</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1>Initial Setup</h1>
  <div class="card">
    <p>Train directly from the SQLite database.</p>
    <form id="setup-form" method="post">
      <div class="row">
        <label>Table</label>
        <select name="table" id="table-select" required></select>
      </div>
      <div class="row">
        <label>Model</label>
        <select name="model" id="model-select">
          <option value="rf" selected>RandomForest</option>
          <option value="ridge">Ridge</option>
          <option value="sgd">SGD</option>
          <option value="xgb">XGBoost</option>
        </select>
      </div>
      <div class="row">
        <label>Target Column</label>
        <select name="target" id="target-select" required></select>
      </div>
      <button type="submit">Train from Database</button>
    </form>
    <div id="setup-result" class="result"></div>
  </div>
</div>
<script>
async function loadTables(){const res=await fetch('/tables');let arr=await res.json();const sel=document.getElementById('table-select');sel.innerHTML='';const preferred='Insurance_Prediction';if(arr.includes(preferred)){arr=[preferred];}arr.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});await loadTargets();}
async function loadTargets(){const table=document.getElementById('table-select').value;const tgt=document.getElementById('target-select');tgt.innerHTML='';if(!table)return;const res=await fetch('/schema/types?table='+encodeURIComponent(table));const data=await res.json();let nums=data.filter(x=>/int|real|num|dec|double|float/i.test(x.type||''));if(nums.length===0)nums=data;const pref=['charges','LN_IC50','ln_ic50','ic50'];nums.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;if(pref.includes(c.name))o.selected=true;tgt.appendChild(o);});}
loadTables();
document.getElementById('table-select').addEventListener('change',loadTargets);
const form=document.getElementById('setup-form');
form.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(form);const res=await fetch('/train',{method:'POST',body:data});const out=document.getElementById('setup-result');if(res.ok){await res.json();out.textContent='Training complete. Reloading...';setTimeout(()=>{window.location.href='/'},1200);}else{out.textContent='Error: '+await res.text();}});
</script>
</body>
</html>
